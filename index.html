<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>AFinanceira | Auditoria Forense Premium</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --ouro: #D4AF37; --fundo: #0a0a0a; --vermelho: #FF0000; --verde: #00FF00; }
        body { background-color: var(--fundo); color: white; font-family: 'Segoe UI', sans-serif; padding: 20px; text-align: center; }
        .card { border: 1px solid var(--ouro); padding: 20px; border-radius: 10px; margin-bottom: 20px; max-width: 500px; margin-left: auto; margin-right: auto; }
        .hidden { display: none; }
        .btn-processar { background: var(--ouro); color: black; padding: 15px 30px; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; font-size: 16px; transition: 0.3s; }
        .btn-processar:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <div id="tela-bloqueio" class="card">
        <h1>Acesso Restrito</h1>
        <p>Auditoria Forense de Banca - Acesso Exclusivo</p>
        <button class="btn-processar" onclick="window.location.href='https://wa.me/5583982052933?text=Ol%C3%A1,%20gostaria%20de%20liberar%20minha%20auditoria%20forense.'">
            Solicitar Liberação via WhatsApp
        </button>
    </div>

    <div id="tela-painel" class="card hidden">
        <h1>Painel AFinanceira</h1>
        <div id="conteudo-auditoria">Carregando auditoria...</div>

        <hr style="border-color: var(--ouro); margin: 20px 0;">
        
        <h2>🎮 Arena de Inteligência</h2>
        <div style="margin-bottom: 20px;">
            <p>Termômetro de Risco</p>
            <input type="range" id="termometro-risco" min="0" max="100" value="50" disabled style="width: 100%;">
            <p id="status-risco">Calculando...</p>
        </div>
        
        <button class="btn-processar" onclick="alert('Duelo de Bancas Iniciado! Prepare sua estratégia.')">Entrar na Arena PvP</button>
        
        <div id="bolha-saldo" onclick="estourarBolha()" style="width: 80px; height: 80px; background: var(--ouro); border-radius: 50%; cursor: pointer; text-align: center; line-height: 80px; font-weight: bold; color: black; margin: 20px auto 0;">SALDO</div>
    </div>

    <script>
        // CONFIGURAÇÃO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyAN-8KC8_WjptE6v6TzuNGdIxpGOIG8vpQ",
            authDomain: "auditoriaigaming.firebaseapp.com",
            databaseURL: "https://auditoriaigaming-default-rtdb.firebaseio.com",
            projectId: "auditoriaigaming",
            storageBucket: "auditoriaigaming.firebasestorage.app",
            messagingSenderId: "273140516999",
            appId: "1:273140516999:web:9b3dd1703bd1731b30d022"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // LÓGICA DE SEGURANÇA (VALIDAÇÃO 24H)
        const urlParams = new URLSearchParams(window.location.search);
        const idCliente = urlParams.get('id');

        window.onload = () => {
            if (!idCliente) return;
            
            db.collection("acessos").doc(idCliente).get().then((doc) => {
                if (doc.exists) {
                    const dataLiberacao = doc.data().horario_liberacao.toDate();
                    const agora = new Date();
                    const diff = (agora - dataLiberacao) / (1000 * 60 * 60);

                    if (diff >= 0 && diff < 24) {
                        document.getElementById('tela-bloqueio').classList.add('hidden');
                        document.getElementById('tela-painel').classList.remove('hidden');
                        executarAuditoria();
                    }
                }
            });
        };

        function executarAuditoria() {
            let saldoFinal = -1200; // Valor de exemplo para o diagnóstico
            document.getElementById('conteudo-auditoria').innerHTML = "<h3>Prejuízo Detectado: R$ " + Math.abs(saldoFinal) + "</h3>";
            ajustarTermometroAutomatico(saldoFinal);
        }

        function ajustarTermometroAutomatico(resultado) {
            let nivelRisco = 50 + (resultado < 0 ? Math.abs(resultado) / 100 : -(resultado / 200));
            nivelRisco = Math.min(Math.max(nivelRisco, 0), 100);
            document.getElementById('termometro-risco').value = nivelRisco;
            document.getElementById('status-risco').innerText = "Risco Atual: " + Math.round(nivelRisco) + "%";
        }

        function estourarBolha() {
            document.getElementById('bolha-saldo').style.display = 'none';
            alert("A bolha estourou! Você visualizou o impacto do seu dreno de capital.");
        }
    </script>
</body>
</html>
